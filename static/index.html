<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Boss 计时器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <h1>⛏ MC Boss 计时器</h1>
      <span id="conn-status" class="conn online">已连接</span>
    </div>
    <div class="header-right">
      <span id="lan-hint" class="lan-hint" title="把这个地址发给局域网内的队友"></span>
      <button id="btn-history" class="btn">历史</button>
      <button id="btn-settings" class="btn">设置</button>
      <button id="btn-add" class="btn primary">＋ 添加 Boss</button>
    </div>
  </header>

  <main>
    <div id="boss-list" class="boss-list"></div>
    <div id="empty-tip" class="empty-tip hidden">
      <p>还没有 Boss，点击右上角「添加 Boss」开始吧</p>
    </div>
  </main>

  <!-- 新增/编辑 Boss 弹窗 -->
  <div id="boss-modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="boss-modal-title">添加 Boss</h2>
      <form id="boss-form">
        <label>Boss 名称 *
          <input type="text" id="f-name" maxlength="50" placeholder="如：末影龙、凋灵" required>
        </label>

        <label>复活时间模式</label>
        <div class="radio-row">
          <label class="radio"><input type="radio" name="f-mode" value="fixed" checked> 固定间隔</label>
          <label class="radio"><input type="radio" name="f-mode" value="range"> 复活区间</label>
        </div>

        <div id="mode-fixed">
          <label>复活间隔（分钟）*
            <input type="number" id="f-minutes" min="0.5" step="0.5" placeholder="如：60">
          </label>
        </div>

        <div id="mode-range" class="hidden">
          <div class="two-col">
            <label>最早（分钟）*
              <input type="number" id="f-range-min" min="0.5" step="0.5" placeholder="30">
            </label>
            <label>最晚（分钟）*
              <input type="number" id="f-range-max" min="0.5" step="0.5" placeholder="45">
            </label>
          </div>
        </div>

        <label>出生位置 / 坐标（可选）
          <input type="text" id="f-location" maxlength="200" placeholder="如：主世界 -100 64 200">
        </label>
        <label>掉落物（可选）
          <input type="text" id="f-drops" maxlength="500" placeholder="如：龙蛋、龙首">
        </label>
        <label>备注（可选）
          <textarea id="f-notes" maxlength="1000" rows="2" placeholder="蹲守注意事项等"></textarea>
        </label>
        <label>OCR 识别关键词（可选，逗号分隔）
          <input type="text" id="f-ocr-keywords" maxlength="200" placeholder="如：末影龙,击杀 —— 屏幕出现任一词即自动标记击杀">
        </label>

        <div class="modal-actions">
          <button type="button" class="btn" data-close>取消</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 击杀确认弹窗 -->
  <div id="kill-modal" class="modal hidden">
    <div class="modal-box small">
      <h2>标记击杀：<span id="kill-boss-name"></span></h2>
      <div class="radio-col">
        <label class="radio"><input type="radio" name="kill-time" value="now" checked> 刚刚击杀（当前时间）</label>
        <label class="radio"><input type="radio" name="kill-time" value="custom"> 补录击杀时间</label>
      </div>
      <input type="datetime-local" id="kill-custom-time" class="hidden">
      <div class="modal-actions">
        <button type="button" class="btn" data-close>取消</button>
        <button type="button" id="btn-kill-confirm" class="btn danger">确认击杀</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <h2>设置</h2>
      <p class="settings-note">以下为本机功能配置，默认全部关闭；队友机器上的设置相互独立。</p>

      <fieldset class="settings-group">
        <legend>OCR 自动识别击杀</legend>
        <label class="check"><input type="checkbox" id="s-ocr-enabled"> 开启（截屏识别屏幕文字，命中关键词自动标记击杀）</label>
        <div class="two-col">
          <label>引擎
            <select id="s-ocr-engine">
              <option value="windows">Windows 自带（快，占用低）</option>
              <option value="rapidocr">RapidOCR（更准，占用高）</option>
            </select>
          </label>
          <label>识别间隔（秒）
            <input type="number" id="s-ocr-interval" min="1" max="60" step="1">
          </label>
        </div>
        <div class="two-col">
          <label>运行模式
            <select id="s-ocr-runmode">
              <option value="always">常驻（按间隔自动识别）</option>
              <option value="manual">手动（点按钮才识别，最省资源）</option>
            </select>
          </label>
          <label>触发方式
            <select id="s-ocr-mode">
              <option value="auto">自动标记击杀</option>
              <option value="confirm">仅提醒，待确认</option>
            </select>
          </label>
        </div>
        <label class="check"><input type="checkbox" id="s-ocr-foreground"> 仅游戏在前台时识别（省资源）</label>
        <label>游戏窗口标题关键字
          <input type="text" id="s-ocr-gamekw" maxlength="50" placeholder="默认 Minecraft">
        </label>
        <label>冷却（秒）
          <input type="number" id="s-ocr-cooldown" min="5" max="3600" step="5">
        </label>
        <label>监测区域
          <span id="s-ocr-region" class="region-text"></span>
        </label>
        <p class="settings-note">区域在悬浮窗 ⚙ → OCR → 框选区域 里设置（如左下角聊天栏）。</p>
        <button type="button" id="btn-ocr-test" class="btn small">立即试一次识别</button>
        <span id="ocr-test-result" class="ocr-test-result"></span>
        <div style="margin-top:10px">
          <p class="settings-note">识别关键词（留空 = 该 Boss 不参与自动识别）：</p>
          <div id="s-kw-list"></div>
        </div>
      </fieldset>

      <fieldset class="settings-group">
        <legend>复活到点提醒</legend>
        <label class="check"><input type="checkbox" id="s-notify-enabled"> 开启</label>
        <label class="check"><input type="checkbox" id="s-notify-sound"> 提示音</label>
        <label class="check"><input type="checkbox" id="s-notify-toast"> Windows 系统通知</label>
        <label class="check"><input type="checkbox" id="s-notify-banner"> 悬浮窗提醒条</label>
        <label>区间 Boss 提醒时机
          <select id="s-notify-range">
            <option value="both">区间两端都提醒</option>
            <option value="earliest">仅最早复活时间</option>
          </select>
        </label>
      </fieldset>

      <fieldset class="settings-group">
        <legend>配置管理</legend>
        <p class="settings-note">Boss 配置与击杀历史自动保存在本机 data 目录，重启不丢失；换机可导出/导入。</p>
        <div class="two-col">
          <button type="button" id="btn-export" class="btn small">导出配置</button>
          <button type="button" id="btn-import" class="btn small">导入配置</button>
        </div>
        <input type="file" id="import-file" accept=".json" class="hidden">
      </fieldset>

      <div class="modal-actions">
        <button type="button" class="btn" data-close>取消</button>
        <button type="button" id="btn-settings-save" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 历史弹窗 -->
  <div id="history-modal" class="modal hidden">
    <div class="modal-box wide">
      <h2>击杀历史</h2>
      <div id="history-stats" class="history-stats"></div>
      <div class="history-table-wrap">
        <table class="history-table">
          <thead><tr><th>时间</th><th>Boss</th><th>来源</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
      <div class="modal-actions">
        <button type="button" id="btn-history-clear" class="btn danger">清空历史</button>
        <button type="button" class="btn" data-close>关闭</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
